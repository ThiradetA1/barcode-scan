<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner - ค้นหาข้อมูลสินค้า</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>สแกนบาร์โค้ด</h1>
            <p>สแกนเพื่อค้นหาข้อมูลสินค้าจากฐานข้อมูลออนไลน์</p>
        </header>

        <!-- Scanner -->
        <section class="card">
            <div class="camera-box" id="cameraBox">
                <div class="scan-line"></div>
            </div>
            <div class="center gap">
                <button id="btnScan" class="btn">เปิดกล้องสแกน</button>
                <button id="btnStop" class="btn btn-outline" disabled>ปิด</button>
            </div>
            <div class="divider"><span>หรือ</span></div>
            <div class="manual">
                <input id="manualInput" type="text" class="input" placeholder="พิมพ์หรือสแกนบาร์โค้ด เช่น SN12345678 หรือ 8851234567890" maxlength="40">
                <button id="btnSearch" class="btn">ค้นหา</button>
            </div>
            <div id="status" class="status"></div>
        </section>

        <!-- Result -->
        <section id="resultSection" class="card hidden">
            <div class="barcode-badge">
                <span class="label">บาร์โค้ด:</span>
                <span id="barcodeDisplay" class="code"></span>
            </div>

            <div class="product-head">
                <img id="productImage" class="product-img" src="" alt="" onerror="this.style.display='none'">
                <div class="product-head-text">
                    <h2 id="productName">-</h2>
                    <p id="productBrand" class="brand">-</p>
                    <p id="productQuantity" class="qty">-</p>
                </div>
            </div>

            <div class="details-grid" id="detailsGrid"></div>

            <div id="ingredientsBox" class="hidden">
                <h3>ส่วนประกอบ</h3>
                <p id="ingredients"></p>
            </div>

            <div id="nutrientsBox" class="hidden">
                <h3>ข้อมูลโภชนาการ (ต่อ 100g)</h3>
                <table id="nutrientsTable"></table>
            </div>

            <div class="center gap" style="margin-top:16px">
                <button id="btnScanAgain" class="btn btn-outline">สแกนต่อ</button>
            </div>
        </section>

        <!-- History -->
        <section id="historySection" class="card hidden">
            <h3>ประวัติการสแกน</h3>
            <ul id="historyList"></ul>
        </section>

        <footer>ข้อมูลจาก Open Food Facts, UPCitemdb, และอื่นๆ</footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
